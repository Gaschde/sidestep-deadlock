name: optimizer common-horizon retention shadow

on:
  push:
    branches:
      - feature/optimizer-next
    paths:
      - app/multiobjective-search.mjs
      - app/deadlock-domain.mjs
      - tools/optimizer-common-horizon-shadow.mjs
      - .github/workflows/optimizer-common-horizon-shadow.yml

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript regression tests
        run: npm test
      - name: Run Warden weapon common-horizon shadow prototype
        run: node tools/optimizer-common-horizon-shadow.mjs --output artifacts/common-horizon-shadow/results.json
      - name: Upload common-horizon artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-common-horizon-shadow
          path: artifacts/common-horizon-shadow/results.json
      - name: Record common-horizon result on optimizer branch
        run: |
          mkdir -p benchmarks/optimizer-v1/experiments/common-horizon-retention-shadow
          cp artifacts/common-horizon-shadow/results.json benchmarks/optimizer-v1/experiments/common-horizon-retention-shadow/results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/optimizer-v1/experiments/common-horizon-retention-shadow/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(benchmark): record common-horizon shadow [skip ci]"
          git pull --rebase origin feature/optimizer-next
          git push
