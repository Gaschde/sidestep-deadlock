name: optimizer path-end Pareto experiment

on:
  push:
    branches:
      - feature/optimizer-next

permissions:
  contents: write

jobs:
  path-end-pareto:
    if: contains(github.event.head_commit.message, '[pareto-exp]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests
        run: npm test
      - name: Run Path-vs-End Pareto experiment
        run: node tools/optimizer-path-end-pareto.mjs --output artifacts/path-end-pareto/results.json
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-path-end-pareto
          path: artifacts/path-end-pareto/
          if-no-files-found: error
      - name: Store experiment on branch
        shell: bash
        run: |
          target="benchmarks/optimizer-v1/experiments/path-end-pareto"
          mkdir -p "$target"
          cp artifacts/path-end-pareto/results.json "$target/results.json"
          cp artifacts/path-end-pareto/summary.json "$target/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "data(benchmark): record path-end Pareto experiment"
          git push origin HEAD:feature/optimizer-next
