name: optimizer controlled multiobjective beam experiment

on:
  push:
    branches:
      - feature/optimizer-next

permissions:
  contents: write

jobs:
  controlled-multiobjective:
    if: contains(github.event.head_commit.message, '[multiobjective-exp]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests
        run: npm test
      - name: Run controlled multiobjective beam experiment
        run: node tools/optimizer-controlled-multiobjective.mjs --output artifacts/controlled-multiobjective-beam/results.json
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-controlled-multiobjective-beam
          path: artifacts/controlled-multiobjective-beam/
          if-no-files-found: error
      - name: Store experiment on branch
        shell: bash
        run: |
          target="benchmarks/optimizer-v1/experiments/controlled-multiobjective-beam"
          mkdir -p "$target"
          cp artifacts/controlled-multiobjective-beam/results.json "$target/results.json"
          cp artifacts/controlled-multiobjective-beam/summary.json "$target/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "data(benchmark): record controlled multiobjective beam experiment"
          git push origin HEAD:feature/optimizer-next
