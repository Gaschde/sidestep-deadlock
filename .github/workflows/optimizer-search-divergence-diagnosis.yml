name: optimizer search divergence diagnosis

on:
  push:
    branches:
      - feature/optimizer-next
    paths:
      - tools/optimizer-search-divergence-diagnosis.mjs
      - .github/workflows/optimizer-search-divergence-diagnosis.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run focused Warden weapon divergence trace
        run: node tools/optimizer-search-divergence-diagnosis.mjs --output artifacts/search-divergence-diagnosis/results.json
      - name: Upload diagnosis artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-divergence-diagnosis
          path: artifacts/search-divergence-diagnosis/results.json
      - name: Record diagnosis result on optimizer branch
        run: |
          mkdir -p benchmarks/optimizer-v1/experiments/search-divergence-diagnosis
          cp artifacts/search-divergence-diagnosis/results.json benchmarks/optimizer-v1/experiments/search-divergence-diagnosis/results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/optimizer-v1/experiments/search-divergence-diagnosis/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(benchmark): record search divergence diagnosis [skip ci]"
          git push
