name: optimizer crossover horizon test

on:
  push:
    branches:
      - feature/optimizer-next
    paths:
      - tools/optimizer-crossover-horizon-test.mjs
      - .github/workflows/optimizer-crossover-horizon-test.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Warden weapon crossover horizon test
        run: node tools/optimizer-crossover-horizon-test.mjs --output artifacts/crossover-horizon-test/results.json
      - name: Upload crossover horizon artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-crossover-horizon-test
          path: artifacts/crossover-horizon-test/results.json
      - name: Record crossover horizon result on optimizer branch
        run: |
          mkdir -p benchmarks/optimizer-v1/experiments/crossover-horizon-test
          cp artifacts/crossover-horizon-test/results.json benchmarks/optimizer-v1/experiments/crossover-horizon-test/results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/optimizer-v1/experiments/crossover-horizon-test/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(benchmark): record crossover horizon test [skip ci]"
          git push
