name: optimizer carry objective A-B

on:
  push:
    branches:
      - feature/optimizer-next

permissions:
  contents: write

jobs:
  carry-objective-ab:
    if: contains(github.event.head_commit.message, '[carry-objective-ab]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests
        run: npm test
      - name: Run fixed-candidate rescore and controlled Warden carry A-B
        run: node tools/optimizer-carry-objective-ab.mjs --output artifacts/carry-objective-ab/results.json
      - name: Upload experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-carry-objective-ab
          path: artifacts/carry-objective-ab/
          if-no-files-found: error
      - name: Store experiment evidence on branch
        shell: bash
        run: |
          target="benchmarks/optimizer-v1/experiments/carry-objective-ab"
          mkdir -p "$target"
          cp artifacts/carry-objective-ab/results.json "$target/results.json"
          cp artifacts/carry-objective-ab/summary.json "$target/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No experiment changes to commit."
          else
            git commit -m "data(benchmark): record carry objective A-B results"
            git push origin HEAD:feature/optimizer-next
          fi
