name: optimizer common-horizon score-only shadow

on:
  push:
    branches:
      - feature/optimizer-next
    paths:
      - app/multiobjective-search.mjs
      - app/search-telemetry.mjs
      - tests/controlled-multiobjective-beam.test.mjs
      - tools/optimizer-common-horizon-score-only.mjs
      - .github/workflows/optimizer-common-horizon-score-only.yml

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript regression tests
        run: npm test
      - name: Run Warden weapon score-only common-horizon A-B-C
        run: node tools/optimizer-common-horizon-score-only.mjs --output artifacts/common-horizon-score-only/results.json
      - name: Upload score-only common-horizon artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-common-horizon-score-only
          path: artifacts/common-horizon-score-only/results.json
      - name: Record score-only common-horizon result on optimizer branch
        run: |
          mkdir -p benchmarks/optimizer-v1/experiments/common-horizon-score-only-shadow
          cp artifacts/common-horizon-score-only/results.json benchmarks/optimizer-v1/experiments/common-horizon-score-only-shadow/results.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/optimizer-v1/experiments/common-horizon-score-only-shadow/results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data(benchmark): record score-only common horizon [skip ci]"
          git pull --rebase origin feature/optimizer-next
          git push
